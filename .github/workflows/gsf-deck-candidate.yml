name: GSF One-Launch Deck Test Candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engine/gfg-native/src/**'
      - 'engine/gfg-native/tests/wsi_gpu_smoke.c'
      - 'engine/gfg-native/tests/delayed_xcb_wm.c'
      - 'engine/gfg-native/tests/implicit_wsi_order_probe.c'
      - 'engine/gfg-native/candidate/**'
      - 'engine/gfg-temporal/src/**'
      - 'engine/gfg-temporal/shaders/**'
      - 'scripts/package_deck_candidate.py'
      - '.github/workflows/gsf-deck-candidate.yml'
permissions:
  contents: read
jobs:
  extracted-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        order: [native-first, validation-first]
        wm: [bare, delayed]
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libvulkan-dev libxcb1-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools xvfb xauth desktop-file-utils
          git clone -q --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/vkh"
      - name: Build actual GPU LMC native layer and test application
        run: |
          make -C engine/gfg-temporal lib
          make -C engine/gfg-native ENABLE_TE=1 BUILD=build-candidate VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" layer build-candidate/wsi-gpu-smoke
          desktop-file-validate engine/gfg-native/candidate/GSF-Test.desktop
          desktop-file-validate engine/gfg-native/candidate/Install-Game-Mode.desktop
          cc -std=c11 -O2 -Wall -Wextra -Werror engine/gfg-native/tests/delayed_xcb_wm.c -lxcb -o "$RUNNER_TEMP/delayed-xcb-wm"
      - name: Package and extract exactly what the owner will download
        run: |
          python3 scripts/package_deck_candidate.py --build engine/gfg-native/build-candidate --out "$RUNNER_TEMP/candidate"
          mkdir -p "$RUNNER_TEMP/extracted with spaces"
          python3 -m zipfile -e "$RUNNER_TEMP/candidate/GSF-Deck-Test.zip" "$RUNNER_TEMP/extracted with spaces"
          chmod a-x "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test/wsi-gpu-smoke"
      - name: Actual extracted baseline, 2x pixels and three live swapchain generations
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          export GSF_CI_WM='${{ matrix.wm }}'
          export GSF_CI_ORDER='${{ matrix.order }}'
          xvfb-run -a -s '-screen 0 1024x768x24' bash -euo pipefail -c '
            if [[ "$GSF_CI_WM" == delayed ]]; then
              "$RUNNER_TEMP/delayed-xcb-wm" > "$RUNNER_TEMP/window-manager.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              for i in {1..50}; do
                if grep -q GSF_DELAYED_WM_READY "$RUNNER_TEMP/window-manager.log"; then break; fi
                sleep 0.1
              done
              grep -q GSF_DELAYED_WM_READY "$RUNNER_TEMP/window-manager.log"
            fi
            python3 "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test/run-test.py" \
              --noninteractive --order "$GSF_CI_ORDER" --results "$RUNNER_TEMP/results"
          '
          if [[ "$GSF_CI_WM" == delayed ]]; then
            grep -Eq 'GSF_RESIZE .*polls=([2-9]|[1-9][0-9]+) status=PASS' "$RUNNER_TEMP/results/"*/lmc-recreate-resize.log
          fi
          if grep -E 'Manifest .*missing required field|loader_add_layer_properties:' "$RUNNER_TEMP/results/"*/*.log; then exit 1; fi
          cat "$RUNNER_TEMP/results/"*/RESULT.txt
      - name: Automatic Game Mode install and exact Steam entry launch smoke
        if: matrix.order == 'native-first' && matrix.wm == 'bare'
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          export HOME="$RUNNER_TEMP/game mode home % percent"
          mkdir -p "$HOME" "$RUNNER_TEMP/steam-stub"
          # Only Steam's external add helper is stubbed. The installed launcher,
          # extracted bundle, Vulkan layer, GPU LMC and WSI are real below.
          cat > "$RUNNER_TEMP/steam-stub/steamos-add-to-steam" <<'SH'
          #!/bin/sh
          printf '%s\n' "$1" >> "$HOME/steam-add-requests.txt"
          SH
          chmod +x "$RUNNER_TEMP/steam-stub/steamos-add-to-steam"
          export PATH="$RUNNER_TEMP/steam-stub:$PATH"
          python3 - "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test/Install-Game-Mode.desktop" <<'PY'
          import pathlib,shlex,subprocess,sys
          entry=pathlib.Path(sys.argv[1])
          command=next(l[5:] for l in entry.read_text().splitlines() if l.startswith('Exec='))
          argv=[entry.as_uri() if x=='%k' else x for x in shlex.split(command)]
          subprocess.run(argv,check=True)
          PY
          python3 "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test/install-game-mode.py" --noninteractive
          test "$(wc -l < "$HOME/steam-add-requests.txt")" -eq 1
          desktop-file-validate "$HOME/.local/share/applications/GSF-Game-Mode-Test.desktop"
          xvfb-run -a -s '-screen 0 1024x768x24' python3 - <<'PY'
          import importlib.util,json,os,pathlib,shlex,subprocess
          home=pathlib.Path.home()
          state=json.loads((home/'.local/share/gsf-test-game-mode/INSTALL_RESULT.json').read_text())
          assert state['status']=='PASS' and state['steam_add_status']=='previously-requested-unverified'
          entry=pathlib.Path(state['desktop_entry'])
          command=next(l[5:] for l in entry.read_text().splitlines() if l.startswith('Exec='))
          argv=[x.replace('%%','%') for x in shlex.split(command)]
          assert len(argv)==1 and pathlib.Path(argv[0]).is_file(),argv
          p=subprocess.run(argv+['--smoke','--results',str(home/'results')],check=False)
          assert p.returncode==0,p.returncode
          reports=list((home/'results').glob('*/REPORT.json'));assert len(reports)==1
          r=json.loads(reports[0].read_text());assert r['status']=='PASS' and r['suite']=='launch-smoke',r
          assert len(r['cases'])==2 and not r['gamescope_environment_hint'],r
          assert (home/'results/GSF-Game-Mode-Latest.zip').is_file()
          spec=importlib.util.spec_from_file_location('candidate',pathlib.Path(state['bundle'])/'run-test.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          os.environ['VK_LAYER_PATH']='/steam/runtime/explicit-layers'
          os.environ['VK_INSTANCE_LAYERS']='VK_LAYER_MESA_overlay:VK_LAYER_GFG_native'
          env=m.child_env(pathlib.Path(state['bundle']),False,False,'native-first',preserve_layers=True)
          assert '/steam/runtime/explicit-layers' in env['VK_LAYER_PATH']
          assert env['VK_INSTANCE_LAYERS']=='VK_LAYER_MESA_overlay'
          print('Stable installed Steam Exec with spaces/percent: actual GPU launch smoke PASS')
          PY
      - name: Implicit WSI order regression with actual loader, driver and GPU LMC
        if: matrix.order == 'native-first' && matrix.wm == 'bare'
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared -Wl,-z,defs \
            -I"$RUNNER_TEMP/vkh/include" engine/gfg-native/tests/implicit_wsi_order_probe.c \
            -o "$RUNNER_TEMP/implicit-wsi-order-probe.so"
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          export XDG_DATA_HOME="$RUNNER_TEMP/order-probe-data"
          export GSF_ORDER_PROBE_ACTIVE=1 ENABLE_GAMESCOPE_WSI=1
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['XDG_DATA_HOME'])/'vulkan/implicit_layer.d';root.mkdir(parents=True)
          layer={'file_format_version':'1.0.0','layer':{'name':'VK_LAYER_FROG_gamescope_wsi_x86_64',
            'type':'GLOBAL','library_path':os.environ['RUNNER_TEMP']+'/implicit-wsi-order-probe.so',
            'api_version':'1.3.0','implementation_version':1,'description':'CI-only order probe, not Gamescope',
            'enable_environment':{'GSF_ORDER_PROBE_ACTIVE':'1'},
            'disable_environment':{'GSF_ORDER_PROBE_DISABLE':'1'}}}
          (root/'order-probe.json').write_text(json.dumps(layer))
          PY
          xvfb-run -a -s '-screen 0 1024x768x24' python3 - <<'PY'
          import importlib.util,json,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP']);kit=root/'extracted with spaces/GSF-Deck-Test'
          evidence=root/'order-probe';evidence.mkdir()
          spec=importlib.util.spec_from_file_location('candidate',kit/'run-test.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          env=m.child_env(kit,True,False,'native-first',preserve_layers=True)
          env.update(GFG_NATIVE_ALGO='lmc-gpu',GFG_NATIVE_OUTPUT_HZ='10',GFG_TEST_ALLOW_SKIPS='1')
          # Negative control: original configuration left Gamescope implicit,
          # placing it above GSF. Observe the rewritten mode at GSF's gate.
          wrong=dict(env);wrong['VK_INSTANCE_LAYERS']='VK_LAYER_GFG_native'
          p=subprocess.run([str(kit/'wsi-gpu-smoke')],env=wrong,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
          (evidence/'implicit-before-gsf.log').write_text(p.stdout)
          assert p.returncode==0,p.stdout
          assert 'original_mode=1 effective_mode=2' in p.stdout,p.stdout
          before=re.search(r'GSF_ORDER_PROBE_CREATE input_mode=2 images=(\d+) usage=0x([0-9a-f]+)',p.stdout);assert before,p.stdout
          # Positive: run the actual installed-test harness with the implicit
          # layer explicitly ordered AFTER GSF. No fake handles or image pixels.
          p=subprocess.run(['python3',str(kit/'game-mode.py'),'--smoke','--results',str(evidence/'results')],
                           stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
          (evidence/'runner.log').write_text(p.stdout)
          assert p.returncode==0,p.stdout
          report_path=next((evidence/'results').glob('*/REPORT.json'));r=json.loads(report_path.read_text())
          assert r['status']=='PASS' and r['suite']=='launch-smoke',r
          log=next((evidence/'results').glob('*/*B-LMC.log')).read_text()
          assert 'original_mode=2 effective_mode=2' in log,log
          after=re.search(r'GSF_ORDER_PROBE_CREATE input_mode=2 images=(\d+) usage=0x([0-9a-f]+)',log);assert after,log
          assert int(after[1])==int(before[1])+2,(before.groups(),after.groups())
          assert int(after[2],16)&3==3 and int(before[2],16)&3!=3
          counts=m.counters(log)
          assert log.count('GSF_ORDER_PROBE_PRESENT ')==counts['real']+counts['synthetic'],counts
          assert counts['synthetic']>=10 and counts['errors']==0,counts
          assert r['cases']['96x64-5to10-B-LMC']['requested_layers'].endswith(':VK_LAYER_FROG_gamescope_wsi_x86_64')
          print('Implicit-layer promotion: GSF before WSI, every real/generated handoff reaches WSI probe PASS')
          PY
      - name: Tampering and missing payload fail before Vulkan with an archived explanation
        run: |
          printf '\ntampered\n' >> "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test/README.txt"
          if python3 "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test/run-test.py" --noninteractive --results "$RUNNER_TEMP/negative"; then
            echo 'Corrupted payload must fail' >&2; exit 1
          fi
          python3 - "$RUNNER_TEMP/negative" <<'PY'
          import json,pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); reports=list(root.glob('*/REPORT.json'))
          assert len(reports)==1
          r=json.loads(reports[0].read_text())
          assert r['status']=='FAIL' and r['stage']=='preflight' and not r['cases']
          assert len(list(root.glob('*.zip')))==1
          assert zipfile.is_zipfile(next(root.glob('*.zip')))
          print('Corrupted install fails before Vulkan; diagnosis archive exists')
          PY
          python3 - "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test" "$RUNNER_TEMP/desktop-home" <<'PY'
          import json,os,pathlib,shlex,subprocess,sys
          kit=pathlib.Path(sys.argv[1]); home=pathlib.Path(sys.argv[2]); home.mkdir()
          entry=kit/'GSF-Test.desktop'
          command=next(x[5:] for x in entry.read_text().splitlines() if x.startswith('Exec='))
          # Exercise the actual desktop Exec payload, including file URI + spaces.
          argv=[entry.as_uri() if x=='%k' else x for x in shlex.split(command)]
          p=subprocess.run(argv,env=dict(os.environ,HOME=str(home)),stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          assert p.returncode==1,p.stdout
          reports=list(home.glob('GSF-Test-Results/*/REPORT.json'))
          assert len(reports)==1 and json.loads(reports[0].read_text())['stage']=='preflight',p.stdout
          print('Desktop Exec with spaced file URI produces an archived corruption report')
          PY
          rm "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test/libVkLayer_gfg_native.so"
          if python3 "$RUNNER_TEMP/extracted with spaces/GSF-Deck-Test/run-test.py" --noninteractive --results "$RUNNER_TEMP/missing"; then
            echo 'Missing library must fail' >&2; exit 1
          fi
      - name: Preserve exact user-facing tested ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GSF-Deck-Test-${{ matrix.order }}-${{ matrix.wm }}
          path: ${{ runner.temp }}/candidate/GSF-Deck-Test.zip
          if-no-files-found: error
          retention-days: 21
      - name: Preserve hardware-proxy and setup failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GSF-candidate-evidence-${{ matrix.order }}-${{ matrix.wm }}
          path: |
            ${{ runner.temp }}/order-probe/
            ${{ runner.temp }}/game mode home % percent/
            ${{ runner.temp }}/window-manager.log
            ${{ runner.temp }}/results/
            ${{ runner.temp }}/negative/
            ${{ runner.temp }}/missing/
            ${{ runner.temp }}/desktop-home/GSF-Test-Results/
          if-no-files-found: warn
          retention-days: 21
