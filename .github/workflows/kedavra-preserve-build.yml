name: Preserve verified Hardware Runtime build in branch
on:
  pull_request:
    paths: ['.github/workflows/kedavra-preserve-build.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    if: github.repository == 'wavessevaw/GSF_Kedavra' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/kedavra-c1-post-direct-history'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: wavessevaw/GSF_Kedavra
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download the original successful build
        run: gh api repos/wavessevaw/GSF_Kedavra/actions/artifacts/12556548733/zip > source.zip
      - name: Verify original bytes and preserve installer with Git objects
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess, zipfile
          repo = "wavessevaw/GSF_Kedavra"
          branch = "experiment/kedavra-c1-post-direct-history"
          prefix = "builds/kedavra-hardware-runtime/"
          filename = "KEDAVRA-HardwareRuntime-test-d831bfef79cc.zip"
          source_head = "d831bfef79cc64418bf6bc360f4bfe4079f82930"
          def api(path, method="GET", data=None):
              command = ["gh", "api", "repos/" + repo + "/" + path, "--method", method]
              if data is not None:
                  command += ["--input", "-"]
              result = subprocess.run(command, input=json.dumps(data) if data is not None else None,
                                      text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          source = pathlib.Path("source.zip").read_bytes()
          outer_hash = hashlib.sha256(source).hexdigest()
          assert outer_hash == "6dffb5542c1a067bdf3e43c2905fae325247ed2009d8904ff9473716761ea435"
          with zipfile.ZipFile(io.BytesIO(source)) as outer:
              assert outer.testzip() is None
              for line in outer.read("SHA256SUMS").decode().splitlines():
                  digest, name = line.split("  ", 1)
                  assert hashlib.sha256(outer.read(name)).hexdigest() == digest
              installer = outer.read(filename)
              info = json.loads(outer.read("BUILD-INFO.json"))
          assert info["head_commit"] == source_head
          with zipfile.ZipFile(io.BytesIO(installer)) as archive:
              assert archive.testzip() is None
              assert json.loads(archive.read("KEDAVRA/EXPERIMENT.json")) == info
              assert json.loads(archive.read("KEDAVRA/runtime/EXPERIMENT.json")) == info
              assert archive.read("KEDAVRA/runtime/bin/gamescope").startswith(b"\x7fELF")
          sha256 = hashlib.sha256(installer).hexdigest()
          info["preserved_installer_sha256"] = sha256
          info["preserved_installer_bytes"] = len(installer)
          info["source_actions_run"] = 40086088039
          info["source_actions_artifact"] = 12556548733
          info["source_outer_sha256"] = outer_hash
          info["archive_integrity"] = "outer and inner ZIP CRC PASS; all original SHA256SUMS PASS"
          readme = "# Тестовая сборка Hardware Runtime\n\n"
          readme += "Устанавливаемый ZIP сохранён непосредственно в этой ветке; это не GitHub Release.\n\n"
          readme += "- Файл: [" + filename + "](" + filename + "). Внутри сразу каталог KEDAVRA/, дополнительного ZIP нет.\n"
          readme += "- Исходная ревизия сборки: " + source_head + ".\n"
          readme += "- [Успешный CI](https://github.com/" + repo + "/actions/runs/40086088039).\n"
          readme += "- SHA256: " + sha256 + ". Проверки CRC внешнего и установочного ZIP пройдены.\n\n"
          readme += "Установите ZIP через Decky. Затем в плагине: Setup → Install/Reinstall Hardware Runtime → Reboot.\n"
          readme += "DirectScan, Deadline-aware analysis и C1 включаются отдельными переключателями плагина; ошибки записываются автоматически, Save report собирает диагностику.\n\n"
          readme += "Экспериментальная сборка, не официальный релиз. Main и релизы не изменяются.\n"
          payloads = {
              prefix + filename: installer,
              prefix + "SHA256SUMS": (sha256 + "  " + filename + "\n").encode(),
              prefix + "BUILD-INFO.json": (json.dumps(info, ensure_ascii=False, indent=2) + "\n").encode(),
              prefix + "README.md": readme.encode(),
          }
          ref = api("git/ref/heads/" + branch)
          head = ref["object"]["sha"]
          assert head == os.environ["EXPECTED_HEAD"], "branch moved; do not overwrite"
          commit = api("git/commits/" + head)
          entries = []
          for path, content in payloads.items():
              blob = api("git/blobs", "POST", {"encoding":"base64", "content":base64.b64encode(content).decode()})
              entries.append({"path":path, "mode":"100644", "type":"blob", "sha":blob["sha"]})
          tree = api("git/trees", "POST", {"base_tree":commit["tree"]["sha"], "tree":entries})
          created = api("git/commits", "POST", {
              "message":"build: preserve verified Hardware Runtime installer in experimental branch\n\nSource runtime d831bfef79cc; exact original installer, CRC and SHA256 verified. No runtime changes or release.\n\nSigned-off-by: Codex <noreply@openai.com>",
              "tree":tree["sha"], "parents":[head]})
          assert api("git/ref/heads/" + branch)["object"]["sha"] == head, "branch moved"
          api("git/refs/heads/" + branch, "PATCH", {"sha":created["sha"], "force":False})
          saved = api("git/trees/" + tree["sha"] + "?recursive=1")
          expected_blob = entries[0]["sha"]
          assert any(x["path"] == prefix + filename and x["sha"] == expected_blob and x.get("size") == len(installer) for x in saved["tree"])
          print("PRESERVED_BUILD_JSON:" + json.dumps({"commit":created["sha"], "path":prefix+filename,
                "bytes":len(installer), "sha256":sha256, "blob":expected_blob, "crc":"PASS"}))
          PY
